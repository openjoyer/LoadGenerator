# Endpoint from the specification. Verify actual handler before using.
targets:
  - name: ingestion
    url: http://localhost:8080/api/v1/logs
    weight: 1
    method: POST
    api_key_env: LOGFLUX_API_KEY
    headers:
      Content-Type: application/json
    body_template_file: bodies/logflux-batch.json.tmpl
    expected_status: [202]
load:
  stages:
    - rps: 100       # 100 events/request = 10,000 events/s
      duration: 10s
    - rps: 1000      # 100,000 events/s
      duration: 20s
limits:
  concurrency: 256
  payload_memory_mib: 128
  request_timeout: 5s
report:
  path: ./report-logflux.json
